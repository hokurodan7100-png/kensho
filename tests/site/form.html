<!doctype html><meta charset="utf-8"><title>応募フォーム</title>
<form action="confirm.html" method="get"><table>
<tr><th>お名前<span>必須</span></th><td><input name="n1" required><input name="n2" required></td></tr>
<tr><th>フリガナ</th><td><input name="k1"><input name="k2"></td></tr>
<tr><th>メールアドレス</th><td><input name="mail" required></td></tr>
<tr><th>郵便番号</th><td><input name="zip"></td></tr>
<tr><th>都道府県</th><td><select name="pref"><option value="">選択</option><option>東京都</option></select></td></tr>
<tr><th>ご感想</th><td><textarea name="memo"></textarea></td></tr>
<tr><th>規約</th><td><label><input type="checkbox" name="agree" required>応募規約に同意する</label></td></tr>
<tr><th>メルマガ</th><td><label><input type="checkbox" name="news">メールマガジンを受け取る</label></td></tr>
</table><button type="submit">確認画面へ</button></form>
